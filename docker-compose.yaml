services:
  financial-transfer-processing-pg:
    container_name: financial-transfer-processing-pg
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: financial_transfer_processing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "15433:5432"
    volumes:
      - financial_transfer_processing_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d financial_transfer_processing"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=financial-transfer-processing-pg;Port=5432;Database=financial_transfer_processing;Username=postgres;Password=postgres
      Database__ApplyMigrations: "true"
    ports:
      - "5033:8080"
    depends_on:
      financial-transfer-processing-pg:
        condition: service_healthy
    restart: unless-stopped

  financial-transfer-processing-rabbitmq:
    container_name: financial-transfer-processing-rabbitmq
    hostname: financial-transfer-processing-rabbitmq
    image: rabbitmq:4.3.5-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-financial_transfers}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-financial_transfers}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - financial_transfer_processing_rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  financial_transfer_processing_pg_data:
  financial_transfer_processing_rabbitmq_data:
